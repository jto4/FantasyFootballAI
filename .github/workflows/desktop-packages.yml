name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot dpkg-dev xvfb

      - name: Install dependencies
        run: npm ci

      - name: Build and smoke-check desktop package
        run: npm run desktop:make

      - name: Upload installer artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sunday-sidekick-${{ runner.os }}-${{ runner.arch }}
          path: apps/desktop/out/make/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Assemble draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download platform packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sunday-sidekick-*
          path: release-input
          merge-multiple: false

      - name: Archive each platform package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/assemble-release-assets.sh release-input release-assets "$GITHUB_REF_NAME"

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to replace assets on an already published release." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" release-assets/*.zip release-assets/INSTALL.md release-assets/LICENSE release-assets/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/*.zip release-assets/INSTALL.md release-assets/LICENSE release-assets/SHA256SUMS \
              --draft \
              --generate-notes \
              --title "Sunday Sidekick ${GITHUB_REF_NAME#v}"
          fi
