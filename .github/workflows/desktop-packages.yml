name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require release tag to match app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release-version.mjs

      - name: Require release tag commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo 'Version tags must point to a commit reachable from main.' >&2
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot dpkg-dev rpm xvfb

      - name: Install dependencies
        run: npm ci

      - name: Require signing credentials for version releases
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done

      - name: Require Windows signing credentials for version releases
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PFX_BASE64)) {
            throw 'Missing required GitHub Actions secret: WINDOWS_CERTIFICATE_PFX_BASE64'
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw 'Missing required GitHub Actions secret: WINDOWS_CERTIFICATE_PASSWORD'
          }

      - name: Import macOS Developer ID certificate
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/sidekick-signing.keychain-db"
          certificate="$RUNNER_TEMP/sidekick-developer-id.p12"
          keychain_password="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 -D > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"

      - name: Configure macOS signing and notarization
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo 'SIDEKICK_MACOS_SIGNING=1'
            printf 'APPLE_ID=%s\n' "$APPLE_ID"
            printf 'APPLE_APP_SPECIFIC_PASSWORD=%s\n' "$APPLE_APP_SPECIFIC_PASSWORD"
            printf 'APPLE_TEAM_ID=%s\n' "$APPLE_TEAM_ID"
          } >> "$GITHUB_ENV"

      - name: Import Windows code-signing certificate
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'sidekick-code-signing.pfx'
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX_BASE64)
          [System.IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          Add-Content -Path $env:GITHUB_ENV -Value "SIDEKICK_WINDOWS_SIGNING=1"
          Add-Content -Path $env:GITHUB_ENV -Value "WINDOWS_CERTIFICATE_FILE=$certificatePath"

      - name: Build and smoke-check desktop package
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v') && secrets.WINDOWS_CERTIFICATE_PASSWORD || '' }}
        run: npm run desktop:make

      - name: Verify signed Windows installer
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1 -PackageDirectory apps/desktop/out/make

      - name: Remove Windows signing certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'sidekick-code-signing.pfx'
          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -LiteralPath $certificatePath -Force
          }

      - name: Verify signed and notarized macOS app
        if: runner.os == 'macOS' && startsWith(github.ref, 'refs/tags/v')
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/verify-macos-package.mjs apps/desktop/out/make "$APPLE_TEAM_ID"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sunday-sidekick-${{ runner.os }}-${{ runner.arch }}
          path: apps/desktop/out/make/*
          if-no-files-found: error
          retention-days: 30

  draft-release:
    name: Assemble draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download platform packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: sunday-sidekick-*
          path: release-input
          merge-multiple: false

      - name: Archive each platform package
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/assemble-release-assets.sh release-input release-assets "$GITHUB_REF_NAME"

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            is_draft="$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq '.isDraft')"
            if [ "$is_draft" != "true" ]; then
              echo "Refusing to replace assets on an already published release." >&2
              exit 1
            fi
            gh release upload "$GITHUB_REF_NAME" release-assets/*.zip release-assets/RELEASES release-assets/*-full.nupkg release-assets/*-win32-x64-Setup.exe release-assets/INSTALL.md release-assets/LICENSE release-assets/SHA256SUMS release-assets/UPDATE-SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/*.zip release-assets/RELEASES release-assets/*-full.nupkg release-assets/*-win32-x64-Setup.exe release-assets/INSTALL.md release-assets/LICENSE release-assets/SHA256SUMS release-assets/UPDATE-SHA256SUMS \
              --draft \
              --generate-notes \
              --title "Sunday Sidekick ${GITHUB_REF_NAME#v}"
          fi
