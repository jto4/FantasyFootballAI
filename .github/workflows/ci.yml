name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  minimum-node-runtime:
    name: Verify minimum Node.js 22.13.0 on macOS
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install minimum supported Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify native credential store
        run: npm run credentials:smoke

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build

  verify:
    name: Verify on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Linux credential-store dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes dbus-x11 gnome-keyring libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Verify native credential store
        if: runner.os != 'Linux'
        run: npm run credentials:smoke

      - name: Verify Linux Secret Service credential store
        if: runner.os == 'Linux'
        run: |
          dbus-run-session -- bash -euo pipefail -c "
            printf '%s\n' 'sunday-sidekick-ci' | gnome-keyring-daemon --unlock --components=secrets >/dev/null
            npm run credentials:smoke
          "

      - name: Check TypeScript
        run: npm run typecheck

      - name: Check lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests
        run: npm test

      - name: Build production app
        run: npm run build

  package:
    name: Smoke-check desktop package on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install Linux package tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes fakeroot dpkg-dev xvfb libsecret-1-dev

      - name: Install dependencies
        run: npm ci

      - name: Build and smoke-check desktop package
        run: npm run desktop:make
